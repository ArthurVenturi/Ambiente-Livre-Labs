{{ define "main" }}
<section class="page-header">
  <h1>{{ .Title }}</h1>
  <p>Browse all event destinations and their related presentations.</p>
</section>
<div class="cards-grid">
  {{ range (sort .Pages "Title") }}
    <article class="card reveal">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <p>{{ .Params.summary }}</p>
      <a href="{{ .RelPermalink }}">Open event page</a>
    </article>
  {{ end }}
</div>
{{ end }}
